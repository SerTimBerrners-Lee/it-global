# Install only after an HTTPS certificate for its-global.ru is available.
server {
    listen 80;
    server_name its-global.ru;
    return 301 https://its-global.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name its-global.ru;

    ssl_certificate /etc/letsencrypt/live/its-global.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/its-global.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
}
