# Install only after an HTTPS certificate for its-global.ru is available.
server {
    listen 80;
    server_name its-global.ru 212.119.42.46;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/its-global-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://its-global.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name its-global.ru;

    ssl_certificate /etc/letsencrypt/live/its-global.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/its-global.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log /var/log/nginx/its-global.access.log;
    error_log /var/log/nginx/its-global.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
        application/json application/ld+json application/xml text/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
}
